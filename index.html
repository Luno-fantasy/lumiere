<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#21172e"><title>LUNOSTILL | Character & Event CG Atelier</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#f7eefb;background:#171020}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#49345c 0,#21172e 35%,#171020 90%);min-height:100vh}header{text-align:center;padding:42px 15px 26px;border-bottom:1px solid #9b7ca35c}header .moon{color:#d9bd83;font-size:32px}h1{font:normal clamp(34px,9vw,56px) Georgia,serif;letter-spacing:.12em;margin:5px 0;color:#f7eafa}header p{color:#d8c3e8;font-size:13px}small,.muted{color:#c3b1ce}main{max-width:940px;margin:auto;padding:18px 12px 90px}.panel{border:1px solid #ad8db377;background:#30223eeb;border-radius:16px;padding:18px;margin:0 0 16px;box-shadow:0 8px 24px #10091730}h2{font-size:17px;color:#ecd7f7;margin:0 0 14px;font-weight:600}h2 span{color:#d6b87f;margin-right:7px}label{display:block;font-size:13px;color:#e5d7ed;margin:12px 0 6px}input,textarea,select{width:100%;background:#1d1529;color:#fff;border:1px solid #826d91;border-radius:9px;padding:11px;font:inherit;font-size:14px;min-width:0}textarea{min-height:88px;resize:vertical}select{appearance:auto}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.choice{background:#3b2a4b;border:1px solid #775d8b;border-radius:10px;color:#f3e6fa;padding:13px 5px;min-height:53px;font-size:13px;cursor:pointer}.choice.active{border-color:#e7c38c;background:#6b4c84;box-shadow:inset 0 0 0 1px #e7c38c}button{font:inherit;cursor:pointer}button.primary{background:linear-gradient(120deg,#8b6bad,#5d427b);border:1px solid #d6b87f;color:white;border-radius:10px;padding:12px 16px}button.secondary{background:#423150;border:1px solid #927b9d;color:white;border-radius:10px;padding:11px 14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions>*{flex:1}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.7;color:#f4e8fb;background:#1a1323;border:1px solid #725b81;border-radius:10px;padding:14px;min-height:85px}footer{text-align:center;font-size:11px;color:#b9a4c6;padding:20px}.note{font-size:12px;color:#d6c3df;line-height:1.7}#status{min-height:20px;color:#e7c38c;font-size:12px;margin-top:8px}@media(max-width:520px){.cols{grid-template-columns:1fr}.panel{padding:14px}.choices{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding-top:30px}.actions>*{min-width:130px}}
</style></head><body>
<header><div class="moon">☾ ✧</div><h1>LUNOSTILL</h1><p>物語の一瞬を、あなたの手で。</p><small>CHARACTER & EVENT CG PROMPT ATELIER</small></header>
<main>
<section class="panel"><h2><span>01</span>キャラクター設定</h2><div class="cols"><div><label for="name">キャラクター名</label><input id="name" placeholder="例：フェリクス"></div><div><label for="subject">人物・人数</label><select id="subject"><option value="1man, solo, adult male">成人男性・1人</option><option value="1woman, solo, adult woman">成人女性・1人</option><option value="1man, 1woman, adult couple">成人男女・2人</option><option value="2men, adult male couple">成人男性・2人</option><option value="2women, adult female couple">成人女性・2人</option></select></div></div><label for="appearance">外見プロンプト（英語）</label><textarea id="appearance" placeholder="silver hair, violet eyes, tall, handsome adult man..."></textarea><label for="outfit">衣装（英語）</label><textarea id="outfit" placeholder="black shirt, elegant jacket..."></textarea><label for="base">既存のプロンプト・LoRA（そのまま保持）</label><textarea id="base" placeholder="your existing prompt, LoRA tags..."></textarea><div class="actions"><button class="secondary" id="save">キャラ保存</button><button class="secondary" id="load">キャラ読込</button><button class="secondary" id="backup">JSON書出</button><button class="secondary" id="restore">JSON読込</button><input id="restoreFile" type="file" accept=".json,application/json" hidden></div><p class="note">キャラはこのブラウザ内に保存されます。機種変更前にはJSONを書き出してください。</p></section>
<section class="panel"><h2><span>02</span>イベントシーン</h2><div class="choices" id="scenes"></div><label for="customScene">自由シーン（英語・任意）</label><input id="customScene" placeholder="例：leaning against a balcony railing"></section>
<section class="panel"><h2><span>03</span>表情・ポーズ・背景</h2><div class="cols"><div><label for="expression">表情</label><select id="expression"></select></div><div><label for="pose">ポーズ</label><select id="pose"></select></div><div><label for="background">背景</label><select id="background"></select></div><div><label for="light">光・時間帯</label><select id="light"></select></div><div><label for="camera">カメラ距離</label><select id="camera"></select></div><div><label for="angle">カメラアングル</label><select id="angle"></select></div><div><label for="ratio">アスペクト比（参考表示）</label><select id="ratio"><option>3:4</option><option>1:1</option><option>4:3</option><option>16:9</option><option>9:16</option></select></div><div><label for="style">画風</label><select id="style"><option value="clean anime visual novel event CG, smooth cel shading, soft gradients, elegant lighting, broad flowing hair strands, refined lineart">恋愛ADV・滑らかなアニメCG</option><option value="anime character design, full body, clean lineart, simple background">立ち絵</option><option value="cinematic anime illustration, atmospheric lighting, soft background blur">映画的なアニメCG</option></select></div></div></section>
<section class="panel"><h2><span>04</span>英語プロンプト出力</h2><p class="note">設定変更で自動更新。アスペクト比は生成サイト側でも指定してください。</p><label>Positive Prompt</label><pre id="positive"></pre><button class="primary" id="copyPositive">Positiveをコピー</button><label>Negative Prompt</label><pre id="negative"></pre><button class="secondary" id="copyNegative">Negativeをコピー</button><p id="status" role="status"></p></section>
</main><footer>☾ LUNOSTILL · v0.1 · Made for your stories</footer>
<script>
const $=id=>document.getElementById(id);
const scenes=[["壁ドン","kabedon, leaning close against a wall"],["顎クイ","gently lifting the chin, intimate eye contact"],["キス寸前","faces close together, almost kissing, romantic tension"],["抱き寄せ","pulling someone into a gentle embrace"],["ベッド","sitting on a bed, intimate quiet atmosphere"],["手を取る","gently taking a hand"],["耳元で囁く","whispering close to the ear"],["振り返り","looking back over the shoulder"],["膝枕","resting head on someone's lap"],["雨の再会","emotional reunion in the rain"],["ダンス","romantic slow dance"],["自由設定",""]];
const expressions=[["自然な微笑み","gentle smile"],["無表情","neutral expression"],["照れ","blushing"],["挑発","teasing smirk"],["真剣","serious expression"],["切なさ","wistful expression"],["喜び","joyful smile"],["悲しみ","sad expression"],["怒り","angry expression"],["驚き","surprised expression"],["困惑","confused expression"],["不安","anxious expression"],["安心","relieved expression"],["眠気","sleepy eyes"],["眠り","sleeping peacefully"],["微笑","subtle smile"],["満面の笑み","bright smile"],["苦笑","wry smile"],["含み笑い","knowing smile"],["照れ笑い","shy smile"],["泣き笑い","smiling through tears"],["涙目","teary eyes"],["泣く","crying"],["号泣","sobbing"],["寂しげ","lonely gaze"],["憂い","melancholic expression"],["決意","determined expression"],["冷淡","cold gaze"],["睨む","intense glare"],["見下ろす","half-lidded commanding gaze"],["甘い視線","affectionate gaze"],["熱い視線","passionate gaze"],["目を逸らす","averting eyes"],["目を閉じる","eyes closed"],["ウインク","winking"],["悪戯っぽい","mischievous grin"],["嫉妬","jealous expression"],["独占欲","possessive gaze"],["恍惚","dreamy expression"]];
const poses=[["自然な立ち姿","standing naturally"],["座る","sitting"],["歩く","walking"],["振り向く","turning around"],["見上げる","looking up"],["見下ろす","looking down"],["腕を組む","arms crossed"],["片手を伸ばす","reaching out one hand"],["手を差し出す","offering a hand"],["頬に触れる","touching a cheek"],["髪に触れる","touching hair"],["手袋を外す","removing a glove"],["ネクタイを緩める","loosening a tie"],["壁に手をつく","hand against a wall"],["腰に手を添える","hand at the waist"],["抱きしめる","embracing"],["顔を寄せる","leaning closer"],["指を絡める","interlacing fingers"],["手を握る","holding hands"],["頬杖","resting chin on hand"],["横になる","lying down"],["ベッドに座る","sitting on a bed"],["ソファに座る","sitting on a sofa"],["窓辺に立つ","standing by a window"],["本を読む","reading a book"],["カップを持つ","holding a cup"],["花を差し出す","offering flowers"],["背中を向ける","back facing viewer"],["片膝をつく","kneeling on one knee"],["ダンスする","dancing"],["自由指定",""]];
const backgrounds=[["ぼかし背景","soft blurred background"],["寝室","cozy bedroom"],["夜の寝室","bedroom at night"],["リビング","modern living room"],["ソファ","elegant lounge"],["カフェ","quiet cafe"],["図書館","library"],["学校の廊下","school corridor"],["教室","classroom"],["屋上","rooftop"],["都会の夜景","city skyline at night"],["夜の路地","city alley at night"],["公園","park"],["桜並木","cherry blossom path"],["海辺","seaside"],["夕暮れの海","beach at sunset"],["雨の街","rainy city street"],["駅のホーム","train platform"],["ホテル","luxury hotel room"],["バルコニー","balcony"],["西洋の城","fantasy castle"],["王宮の広間","royal ballroom"],["玉座の間","throne room"],["中世の街","medieval town"],["森","enchanted forest"],["庭園","flower garden"],["神殿","ancient temple"],["砂漠の宮殿","arabian palace"],["星空","starry night sky"],["自由背景",""]];
const lights=[["柔らかな自然光","soft natural light"],["朝日","morning sunlight"],["昼光","daylight"],["夕暮れ","golden hour"],["マジックアワー","purple-blue twilight"],["夜","night atmosphere"],["月明かり","moonlight"],["キャンドル","warm candlelight"],["逆光","soft backlighting"],["窓からの光","window light"],["室内灯","warm indoor lighting"]];
const cameras=[["バストアップ","bust shot"],["顔アップ","face close-up"],["上半身","upper body shot"],["腰上","waist-up shot"],["膝上","knee-up shot"],["全身","full body shot"],["超接写","extreme close-up"]];
const angles=[["正面","front view"],["斜め45度","three-quarter view"],["横顔","side profile"],["背面","back view"],["俯瞰","high angle view"],["煽り","low angle view"],["主観視点","point of view"]];
function fill(id,data){$(id).innerHTML=data.map(([a,b])=>'<option value="'+b.replaceAll('"','&quot;')+'">'+a+'</option>').join('')}
fill('expression',expressions);fill('pose',poses);fill('background',backgrounds);fill('light',lights);fill('camera',cameras);fill('angle',angles);
let selected=2;
function renderScenes(){$('scenes').innerHTML='';scenes.forEach(([name],i)=>{let b=document.createElement('button');b.className='choice'+(selected===i?' active':'');b.textContent=name;b.type='button';b.onclick=()=>{selected=i;renderScenes();update()};$('scenes').append(b)})}
const clean=s=>(s||'').trim().replace(/^[,\s]+|[,\s]+$/g,'');
function update(){const parts=[$('subject').value,$('appearance').value,$('outfit').value,$('base').value,scenes[selected][1],$('customScene').value,$('expression').value,$('pose').value,$('camera').value,$('angle').value,$('background').value,$('light').value,$('style').value].map(clean).filter(Boolean);$('positive').textContent=parts.join(', ');$('negative').textContent='low quality, worst quality, blurry, bad anatomy, bad hands, extra fingers, missing fingers, extra limbs, deformed hands, malformed face, distorted proportions, watermark, text, signature, noisy texture, excessive hair strands, oversharpening'}
document.querySelectorAll('input,textarea,select').forEach(el=>el.addEventListener('input',update));renderScenes();update();
function status(t){$('status').textContent=t}
async function copy(id){try{await navigator.clipboard.writeText($(id).textContent);status('コピーしました')}catch(e){status('コピーできませんでした。テキストを長押ししてコピーしてください')}}
$('copyPositive').onclick=()=>copy('positive');$('copyNegative').onclick=()=>copy('negative');
const charFields=['name','subject','appearance','outfit','base'];function current(){return Object.fromEntries(charFields.map(k=>[k,$(k).value]))}
function all(){try{return JSON.parse(localStorage.getItem('lunostill.characters')||'{}')}catch{return {}}}
$('save').onclick=()=>{const n=$('name').value.trim();if(!n){status('キャラクター名を入力してください');return}try{const a=all();a[n]=current();localStorage.setItem('lunostill.characters',JSON.stringify(a));status('保存しました：'+n)}catch{status('保存できませんでした')}};
$('load').onclick=()=>{const a=all(),names=Object.keys(a);if(!names.length){status('保存済みキャラがありません');return}const n=prompt('読み込むキャラ名：\n'+names.join('\n'),names[0]);if(!n)return;if(!a[n]){status('見つかりません');return}charFields.forEach(k=>{if(typeof a[n][k]==='string')$(k).value=a[n][k]});update();status('読み込みました：'+n)};
$('backup').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,characters:all()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lunostill-characters.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('restore').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!data.characters||typeof data.characters!=='object'||Array.isArray(data.characters))throw Error();const merged={...all(),...data.characters};localStorage.setItem('lunostill.characters',JSON.stringify(merged));status('バックアップを復元しました')}catch{status('JSONの形式を確認してください')}e.target.value=''};
</script></body></html>
